[workspace]
members = ["programs/forge"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "LicenseRef-Proprietary"
publish = false

[workspace.metadata.solana]
tools-version = "v1.57"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
