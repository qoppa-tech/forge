[package]
name = "forge"
version = "0.1.0"
description = "FORGE bank-controlled test-token vault"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "forge"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.0"
# Anchor 1.2's token-account init macro requires token_interface even for legacy Token.
# Program<Token> and Account<Mint/TokenAccount> still reject Token-2022 at runtime.
anchor-spl = { version = "=1.2.0", default-features = false, features = [
  "token",
  "token_2022",
] }

[dev-dependencies]
litesvm = "=0.10.0"
solana-message = "=3.0.1"
solana-transaction = "=3.0.2"
solana-signer = "=3.0.0"
solana-keypair = "=3.1.2"
solana-transaction-error = "=3.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
] }
